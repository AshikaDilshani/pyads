name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas openpyxl requests python-dotenv mistralai \
                      pylint pycodestyle pydocstyle

      - name: Run unit tests
        run: python test.py

      - name: pylint
        run: python -m pylint pyads/

      - name: pycodestyle
        run: python -m pycodestyle pyads/

      - name: pydocstyle
        run: python -m pydocstyle pyads/
